name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test

  release-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - name: Ensure release label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create ci-approved --repo "$GITHUB_REPOSITORY" --color 00ff00 --description "Approved by CI" || true
      - name: Ensure release label is present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Checking that the 'ci-approved' label exists on this repository..."
          if gh label list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name' | grep -qx 'ci-approved'; then
            echo "Release label present."
          else
            echo "::error::Required label 'ci-approved' is missing. The release-gate check cannot pass until it exists."
            exit 1
          fi
